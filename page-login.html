<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0ea5e9">
    <title>Login · Self Learners</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
          media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    </noscript>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            --navy: #0a1e3f;
            --sky: #0ea5e9; --sky-dark: #0284c7; --sky-soft: #e0f2fe;
            --text: #0f1419; --text-soft: #475569; --text-muted: #94a3b8;
            --border: #e2e8f0;
            --whatsapp: #25d366; --whatsapp-dark: #128c7e;
            --rf: 9999px;
            --shadow-sm: 0 2px 6px rgba(10,30,63,.06);
            --shadow-xl: 0 30px 60px -15px rgba(10,30,63,.25);
        }
        html, body { -webkit-text-size-adjust: 100%; }
        body {
            background: #f4f6fa;
            min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem 1.25rem;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: contain;
        }
        .login-page {
            width: 100%;
            max-width: 400px;
        }

        /* ============================================================
           TOASTS
           ============================================================ */
        .toast-container { position: fixed; top: 1.3rem; right: 1.3rem; z-index: 9999; display: flex; flex-direction: column; gap: .7rem; max-width: 380px; width: calc(100% - 2.6rem); }
        .toast { padding: 1rem 1.2rem; border-radius: 14px; font-size: .88rem; font-weight: 600; box-shadow: var(--shadow-xl); animation: slideInToast .35s cubic-bezier(.16,1,.3,1); display: flex; align-items: center; gap: .7rem; border-left: 4px solid; }
        .toast.success { background: #d1fae5; color: #065f46; border-left-color: #059669; }
        .toast.error { background: #fee2e2; color: #991b1b; border-left-color: #dc2626; }
        .toast.warning { background: #fef3c7; color: #92400e; border-left-color: #d97706; }
        .toast.info { background: var(--sky-soft); color: #075985; border-left-color: var(--sky); }
        .toast .toast-close { margin-left: auto; background: 0 0; border: none; font-size: 1.1rem; cursor: pointer; color: inherit; opacity: .5; }
        @keyframes slideInToast { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutToast { to { opacity: 0; transform: translateY(-8px); } }
        .toast.removing { animation: fadeOutToast .25s ease forwards; }

        /* ============================================================
           LOGO ANIMATION
           ============================================================ */
        .logo-stage {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            cursor: pointer;
            user-select: none;
        }
        .logo-stage svg {
            width: 180px;
            height: auto;
            overflow: visible;
            display: block;
        }

        .logo-stage .shape,
        .logo-stage .dot,
        .logo-stage .logo-text {
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .logo-stage .shape-1 {
            animation: dropIn 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.15s forwards,
                       floatShape1 4.2s ease-in-out infinite 1.1s;
        }
        .logo-stage .shape-2 {
            animation: dropIn 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.35s forwards,
                       floatShape2 4.6s ease-in-out infinite 1.3s;
        }
        .logo-stage .shape-3 {
            animation: dropIn 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.55s forwards,
                       floatShape3 5s ease-in-out infinite 1.5s;
        }
        .logo-stage .dot-1 {
            animation: popIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.75s forwards,
                       pulseDot 3.2s ease-in-out infinite 1.6s;
        }
        .logo-stage .dot-2 {
            animation: popIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.95s forwards,
                       pulseDot 3.2s ease-in-out infinite 1.8s;
        }
        .logo-stage .dot-3 {
            animation: popIn 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.15s forwards,
                       pulseDot 3.2s ease-in-out infinite 2.0s;
        }
        .logo-stage .logo-text {
            animation: fadeUp 1.0s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
        }

        @keyframes dropIn {
            0%   { opacity: 0; transform: translateY(-55px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0%   { opacity: 0; transform: scale(0); }
            65%  { transform: scale(1.18); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(22px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatShape1 {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-7px); }
        }
        @keyframes floatShape2 {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-9px); }
        }
        @keyframes floatShape3 {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-stage .shape,
            .logo-stage .dot,
            .logo-stage .logo-text {
                animation: none !important;
                opacity: 1 !important;
            }
        }

        /* ============================================================
           PLAIN FORM — no card, no box, no shadow
           ============================================================ */
        .login-form label {
            display: block;
            font-weight: 600;
            font-size: .82rem;
            color: var(--navy);
            margin-bottom: .4rem;
        }
        .login-form .input-group {
            position: relative;
            margin-bottom: 1.1rem;
        }
        .login-form .input-group input {
            width: 100%;
            padding: .95rem 1.1rem;
            padding-right: 3rem;
            border: 1.5px solid var(--border);
            border-radius: var(--rf);
            font-size: .95rem;
            font-family: inherit;
            background: #ffffff;
            color: var(--text);
            font-weight: 500;
            transition: all .2s;
        }
        .login-form .input-group input:focus {
            outline: 0;
            border-color: var(--sky);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(14,165,233,.12);
        }
        .login-form .toggle-password {
            position: absolute;
            right: .95rem;
            top: 50%;
            transform: translateY(-50%);
            background: 0 0;
            border: none;
            cursor: pointer;
            font-size: 1.15rem;
            color: var(--text-muted);
            padding: .3rem;
        }
        .login-form .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--sky), var(--sky-dark));
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: .98rem;
            padding: .95rem;
            border-radius: var(--rf);
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 8px 20px -6px rgba(14,165,233,.45);
            margin-top: .3rem;
            transition: all .2s;
        }
        .login-form .btn-login:hover:not(:disabled) { transform: translateY(-1px); }
        .login-form .btn-login:disabled { opacity: .5; cursor: not-allowed; }

        /* ============================================================
           WHATSAPP
           ============================================================ */
        .wa-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .35rem;
            font-size: .72rem;
            color: #065f46;
            font-weight: 700;
            margin: 1.6rem 0 .6rem;
            text-transform: uppercase;
            letter-spacing: .04em;
            text-align: center;
        }
        .wa-label .wa-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--whatsapp);
            box-shadow: 0 0 0 3px rgba(37,211,102,.25);
            animation: waPulse 2s infinite;
            flex-shrink: 0;
        }
        @keyframes waPulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(37,211,102,.25); }
            50%      { box-shadow: 0 0 0 6px rgba(37,211,102,.08); }
        }
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            width: 100%;
            background: linear-gradient(135deg, var(--whatsapp), var(--whatsapp-dark));
            color: #fff;
            font-weight: 700;
            font-size: .88rem;
            padding: .85rem 1rem;
            border-radius: var(--rf);
            text-decoration: none;
            box-shadow: 0 6px 16px -4px rgba(37,211,102,.45);
            transition: all .2s;
            min-height: 46px;
            font-family: inherit;
            border: none;
            cursor: pointer;
        }
        .btn-whatsapp:hover { transform: translateY(-2px); }
        .btn-whatsapp .wa-icon { font-size: 1.1rem; display: inline-flex; }
        .wa-number {
            display: block;
            text-align: center;
            margin-top: .5rem;
            font-size: .72rem;
            color: #065f46;
            font-weight: 600;
            letter-spacing: .02em;
        }

        /* ============================================================
           DIVIDER + GUEST
           ============================================================ */
        .divider {
            display: flex;
            align-items: center;
            gap: .8rem;
            margin: 1.3rem 0 1.1rem;
            color: var(--text-muted);
            font-size: .7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .btn-guest {
            width: 100%;
            background: #ffffff;
            border: 1.5px solid var(--border);
            color: var(--text-soft);
            font-weight: 600;
            font-size: .92rem;
            padding: .85rem;
            border-radius: var(--rf);
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            transition: all .18s;
        }
        .btn-guest:hover {
            background: #fff;
            border-color: var(--sky);
            color: var(--sky-dark);
        }
        .btn-guest .guest-hint {
            font-size: .74rem;
            font-weight: 500;
            color: #92400e;
        }

        .login-footer {
            text-align: center;
            font-size: .78rem;
            color: var(--text-muted);
            margin-top: 1.2rem;
            font-weight: 500;
        }

        @media (max-width: 560px) {
            body { padding: 1.2rem 1rem; }
            .logo-stage svg { width: 160px; }
            .logo-stage { margin-bottom: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="login-page">
    <div class="toast-container" id="toastContainer"></div>

    <!-- Animated logo (plain, no card) -->
    <div class="logo-stage" id="logoStage" onclick="replayLogoAnimation()" title="Click to replay">
        <svg viewBox="0 0 820 870" xmlns="http://www.w3.org/2000/svg">
            <!-- Shape 1: Black -->
            <polygon class="shape shape-1"
                points="44,7  255,560  115,560  4,267"
                fill="#000000" />

            <!-- Shape 2: Yellow -->
            <polygon class="shape shape-2"
                points="290,33  478,560  335,560  252,300"
                fill="#F6D810" />

            <!-- Shape 3: Blue -->
            <polygon class="shape shape-3"
                points="510,27  700,560  555,560  472,288"
                fill="#38B6FE" />

            <!-- Dots -->
            <circle class="dot dot-1" cx="200" cy="628" r="32" fill="#000000" />
            <circle class="dot dot-2" cx="440" cy="630" r="32" fill="#F6D810" />
            <circle class="dot dot-3" cx="660" cy="630" r="32" fill="#38B6FE" />

            <!-- Typography -->
            <text class="logo-text" x="410" y="780"
                  font-family="'Times New Roman', Times, Georgia, serif"
                  font-size="40" font-weight="700" fill="#111111"
                  text-anchor="middle" letter-spacing="5.8">
                <tspan font-size="48" font-weight="800">S</tspan>ELF 
                <tspan font-size="48" font-weight="800">L</tspan>EARNERS
            </text>
        </svg>
    </div>

    <!-- Plain form (no card, no box) -->
    <div class="login-form">
        <label for="emailInput">Email / Username</label>
        <div class="input-group">
            <input type="text" id="emailInput" placeholder="Enter your email or username" autocomplete="username"/>
        </div>

        <label for="passwordInput">Password</label>
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password"/>
            <button class="toggle-password" id="togglePasswordBtn" type="button">👁️</button>
        </div>

        <button class="btn-login" id="loginBtn">Sign In</button>

        <div class="wa-label">
            <span class="wa-dot"></span>
            New here? Sign up on WhatsApp
        </div>
        <a class="btn-whatsapp"
           id="waRegisterBtn"
           href="https://wa.me/923070508401?text=Hi%21%20I%20want%20to%20sign%20up%20for%20Self%20Learners%20Jobs%20Exam%20Hub.%20Please%20guide%20me."
           target="_blank"
           rel="noopener noreferrer">
            <span class="wa-icon">💬</span>
            Sign Up / Contact on WhatsApp
        </a>
        <span class="wa-number">+92 307 0508401</span>

        <div class="divider">or</div>

        <button class="btn-guest" id="guestBtn">
            👤 Continue as Guest
            <span class="guest-hint">(15 MCQs only)</span>
        </button>

        <div class="login-footer"><span id="loginStatus">Loading...</span></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const SHEET_ID = '17yY_LUiqMsABz7tbtAXFpZIYpHN2TJTZSxo7oJWzckI';
    const LOGIN_GID = '2076597807';
    const LOGIN_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=' + LOGIN_GID;
    const KEY_USER = 'slUser';

    const WHATSAPP_NUMBER = '923070508401';

    const $ = (id) => document.getElementById(id);
    const ui = {
        email: $('emailInput'), pass: $('passwordInput'),
        tglPw: $('togglePasswordBtn'), loginBtn: $('loginBtn'),
        guestBtn: $('guestBtn'), loginStat: $('loginStatus'),
        waRegisterBtn: $('waRegisterBtn')
    };

    let users = [];
    let passwordVisible = false;
    let toastTimer = null;

    /* ---------- Logo animation replay ---------- */
    window.replayLogoAnimation = function () {
        const svg = document.querySelector('#logoStage svg');
        if (!svg) return;
        svg.style.display = 'none';
        void svg.offsetWidth;
        svg.style.display = 'block';
    };

    function clean(v) { if (v == null) return ''; return String(v).replace(/[\u200B-\u200D\uFEFF\u00A0]/g, ' ').replace(/\s+/g, ' ').trim(); }
    function parseCSVLine(line) {
        const result = []; let cell = ''; let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (inQuotes) {
                if (ch === '"' && line[i + 1] === '"') { cell += '"'; i++; }
                else if (ch === '"') inQuotes = false;
                else cell += ch;
            } else {
                if (ch === '"') inQuotes = true;
                else if (ch === ',') { result.push(clean(cell)); cell = ''; }
                else cell += ch;
            }
        }
        result.push(clean(cell));
        return result;
    }

    function toast(message, type, duration, showIcon) {
        type = type || 'info'; duration = duration || 4000;
        if (toastTimer) clearTimeout(toastTimer);
        const container = $('toastContainer');
        if (!container) return;
        while (container.firstChild) container.removeChild(container.firstChild);
        const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.innerHTML = (showIcon !== false ? '<span>' + icons[type] + '</span>' : '') + '<span>' + message + '</span>' + '<button class="toast-close">✕</button>';
        container.appendChild(t);
        const remove = function () { t.classList.add('removing'); setTimeout(function () { t.remove(); }, 300); };
        t.querySelector('.toast-close').onclick = remove;
        toastTimer = setTimeout(remove, duration);
    }

    ui.tglPw.onclick = function () {
        passwordVisible = !passwordVisible;
        ui.pass.type = passwordVisible ? 'text' : 'password';
        ui.tglPw.textContent = passwordVisible ? '🙈' : '👁️';
    };

    function fetchUsers() {
        ui.loginStat.textContent = '⏳ Loading...';
        ui.loginBtn.disabled = true;
        fetch(LOGIN_URL + '&_t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (text) {
                var lines = text.split('\n').filter(function (l) { return l.trim(); });
                users = [];
                for (var i = 1; i < lines.length; i++) {
                    var cols = parseCSVLine(lines[i]);
                    if (cols.length >= 2 && cols[0] && cols[1]) {
                        users.push({ user: cols[0].trim(), pass: cols[1].trim() });
                    }
                }
                ui.loginStat.textContent = '🔐 Sign in to continue';
                ui.loginBtn.disabled = false;
            })
            .catch(function () {
                ui.loginStat.textContent = '⚠️ Unable to connect';
                ui.loginBtn.disabled = true;
                toast('Unable to load user data', 'error', 4000, true);
            });
    }

    function notifyParent(user, isGuest) {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'SL_LOGIN',
                    user: user,
                    isGuest: !!isGuest
                }, '*');
            }
        } catch (e) { /* ignore */ }
    }

    function handleLogin() {
        var u = ui.email.value.trim();
        var p = ui.pass.value.trim();
        if (!u || !p) { toast('Enter username and password', 'warning', 3000, true); return; }
        var match = users.find(function (x) { return x.user.toLowerCase() === u.toLowerCase() && x.pass === p; });
        if (match) {
            toast('Welcome, ' + match.user + '!', 'success', 2000, true);
            try { localStorage.setItem(KEY_USER, JSON.stringify(match)); } catch (e) {}
            setTimeout(function () { notifyParent(match, false); }, 400);
        } else {
            toast('Invalid credentials', 'error', 3000, true);
            ui.loginStat.textContent = '❌ Login failed';
        }
    }

    function handleGuest() {
        var guestUser = { user: 'Guest' };
        toast('Welcome, Guest! Limited to 15 MCQs.', 'info', 2500, true);
        try { localStorage.setItem(KEY_USER, JSON.stringify(guestUser)); } catch (e) {}
        setTimeout(function () { notifyParent(guestUser, true); }, 400);
    }

    function buildWhatsAppLink() {
        var msg = "Hi! I want to sign up for Self Learners Jobs Exam Hub. Please guide me.";
        return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg);
    }

    if (ui.waRegisterBtn) {
        ui.waRegisterBtn.href = buildWhatsAppLink();
        ui.waRegisterBtn.addEventListener('click', function () {
            if (!ui.waRegisterBtn.href || ui.waRegisterBtn.href === '#' || !/wa\.me/.test(ui.waRegisterBtn.href)) {
                ui.waRegisterBtn.href = buildWhatsAppLink();
            }
        });
    }

    ui.loginBtn.onclick = handleLogin;
    ui.guestBtn.onclick = handleGuest;
    ui.email.onkeydown = ui.pass.onkeydown = function (e) { if (e.key === 'Enter') handleLogin(); };

    fetchUsers();
})();
</script>
</body>
</html>
